name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: Lint, script: lint }
          - { name: Format, script: format:check }
          - { name: Typecheck, script: typecheck }
          - { name: Turbo env, script: turbo-env:check }
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        if: matrix.check.script == 'typecheck'
        run: pnpm --filter @lazariways/database generate
        env:
          # prisma.config.ts requires a URL; generate never connects to it.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - run: pnpm ${{ matrix.check.script }}

  migrations:
    name: Migrations up to date
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations to an empty database
        run: pnpm --filter @lazariways/database db:migrate:deploy

      - name: Fail if schema has unmigrated changes
        working-directory: packages/database
        run: |
          set +e
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema --script --exit-code > drift.sql
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::error::packages/database/prisma/schema differs from packages/database/prisma/migrations. Run 'pnpm prisma migrate dev' and commit the result."
            cat drift.sql
            exit 1
          fi
          exit "$status"

  course-check:
    name: Course content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @lazariways/database generate
        env:
          # prisma.config.ts requires a URL; generate never connects to it.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - run: pnpm --filter @lazariways/learning-app-admin course:check

  migrate:
    name: Migrate database
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, migrations]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: db-migrate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @lazariways/database db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  course-import:
    name: Import course
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [migrate, course-check]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      # Overlapping imports would both recreate the same exam's exercises.
      group: course-import
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @lazariways/database generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - run: pnpm --filter @lazariways/learning-app-admin course:import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NARAKEET_API_KEY: ${{ secrets.NARAKEET_API_KEY }}
          BUCKET_AUDIOS_PATH: ${{ secrets.BUCKET_AUDIOS_PATH }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
